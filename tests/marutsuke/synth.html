<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>丸つけカメラ — 試験用の写真をつくる（テスト専用。公開ページではない）</title>
<meta name="robots" content="noindex">
<style>
  @font-face { font-family: "KleeTest"; src: url("../../fonts/klee-kana.woff2") format("woff2"); }
  body { font-family: "KleeTest"; }
</style>
</head>
<body>
<p>テスト専用（tests/marutsuke/accuracy.mjs が使う）。印刷した紙を撮った写真の代わりに、紙の画像へ手書きの数字を書きこみ、回転・ゆがみ・ぼかし・影・ノイズ・JPEG を加える。</p>
<script>
'use strict';
// 決まった乱数（mulberry32）
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function loadImg(url) { return new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; }); }
function solve(A, b) {
  const n = b.length, M = A.map((r, i) => r.concat([b[i]]));
  for (let c = 0; c < n; c++) {
    let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < n; r++) { if (r === c) continue; const f = M[r][c] / M[c][c]; for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
  }
  return M.map((r, i) => r[n] / r[i]);
}
function homography(src, dst) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  return solve(A, b).concat([1]);
}

/**
 * opt: { sheet: dataURL, pxPerMm, mnist: base64(labels 2000 + images), writes: [{x,y,s (mm), digit, kind:'mnist'|'font', idx, align}],
 *        seed, out:[w,h], fill, rot (deg), persp, blur, shadow, noise, light, jpeg }
 */
window.compose = async function (opt) {
  const R = rng(opt.seed);
  await document.fonts.load('80px KleeTest');
  const sheet = await loadImg(opt.sheet);
  const A = document.createElement('canvas');
  A.width = sheet.width; A.height = sheet.height;
  const ax = A.getContext('2d');
  ax.drawImage(sheet, 0, 0);
  const raw = Uint8Array.from(atob(opt.mnist), c => c.charCodeAt(0));
  const N = 2000, k = opt.pxPerMm;
  // 手書きの数字（鉛筆の色・濃さはばらつく）
  for (const w of opt.writes) {
    const gray = 30 + Math.floor(R() * 60), alpha = 0.65 + R() * 0.35;
    const h = w.s * (0.55 + R() * 0.3) * k;              // 字の高さ
    const cx = (w.x + w.s / 2 + (R() - 0.5) * w.s * 0.18) * k, cy = (w.y + w.s / 2 + (R() - 0.5) * w.s * 0.18) * k;
    ax.save();
    ax.translate(cx, cy); ax.rotate((R() - 0.5) * 0.3);
    if (w.kind === 'mnist') {
      const g = document.createElement('canvas'); g.width = 28; g.height = 28;
      const gx = g.getContext('2d'), im = gx.createImageData(28, 28);
      for (let i = 0; i < 784; i++) { const v = raw[N + w.idx * 784 + i]; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = gray; im.data[i * 4 + 3] = v * alpha; }
      gx.putImageData(im, 0, 0);
      const box = h * 28 / 20;
      ax.imageSmoothingEnabled = true; ax.imageSmoothingQuality = 'high';
      ax.drawImage(g, -box / 2, -box / 2, box, box);
    } else {
      ax.fillStyle = `rgba(${gray},${gray},${gray},${alpha})`;
      ax.font = `${h * 1.25}px KleeTest`; ax.textAlign = 'center'; ax.textBaseline = 'middle';
      ax.fillText(String(w.digit), 0, 0);
    }
    ax.restore();
  }
  // 撮った写真へ
  const [W, H] = opt.out;
  const sw = A.width, sh = A.height;
  const scale = opt.fill * Math.min(W / sw, H / sh);
  const th = opt.rot * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
  const md = Math.min(W, H);
  const corners = [[0, 0], [sw, 0], [sw, sh], [0, sh]].map(([x, y]) => {
    const dx = (x - sw / 2) * scale, dy = (y - sh / 2) * scale;
    return [W / 2 + dx * c - dy * s + (R() - 0.5) * 2 * opt.persp * md, H / 2 + dx * s + dy * c + (R() - 0.5) * 2 * opt.persp * md];
  });
  const Hinv = homography(corners, [[0, 0], [sw, 0], [sw, sh], [0, sh]]);
  const src = ax.getImageData(0, 0, sw, sh).data;
  const O = document.createElement('canvas'); O.width = W; O.height = H;
  const ox = O.getContext('2d'), out = ox.createImageData(W, H), d = out.data;
  const bg = [90 + R() * 80, 70 + R() * 60, 50 + R() * 50];
  // 影: なめらかな境目の半平面（手やスマホの影）と、全体の明るさのむら
  const sa = R() * Math.PI * 2, sx = Math.cos(sa), sy = Math.sin(sa), soff = (R() - 0.3) * 0.5;
  const la = R() * Math.PI * 2;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dd = Hinv[6] * x + Hinv[7] * y + 1;
    const u = (Hinv[0] * x + Hinv[1] * y + Hinv[2]) / dd, v = (Hinv[3] * x + Hinv[4] * y + Hinv[5]) / dd;
    let r, g, b;
    if (u >= 0 && v >= 0 && u < sw - 1 && v < sh - 1) {
      const x0 = u | 0, y0 = v | 0, fx = u - x0, fy = v - y0, i = (y0 * sw + x0) * 4;
      const m = (o) => src[i + o] * (1 - fx) * (1 - fy) + src[i + 4 + o] * fx * (1 - fy) + src[i + sw * 4 + o] * (1 - fx) * fy + src[i + sw * 4 + 4 + o] * fx * fy;
      r = m(0); g = m(1) * 0.98; b = m(2) * 0.93;   // 紙は少し黄色っぽく
    } else { r = bg[0]; g = bg[1]; b = bg[2]; }
    const nx = x / W - 0.5, ny = y / H - 0.5;
    const t = (nx * sx + ny * sy - soff) * 12;
    const shade = 1 - opt.shadow / (1 + Math.exp(-t));
    const light = opt.light * (1 + 0.12 * (nx * Math.cos(la) + ny * Math.sin(la)));
    const n = (R() + R() + R() - 1.5) * opt.noise;
    d[(y * W + x) * 4] = r * shade * light + n; d[(y * W + x) * 4 + 1] = g * shade * light + n; d[(y * W + x) * 4 + 2] = b * shade * light + n; d[(y * W + x) * 4 + 3] = 255;
  }
  ox.putImageData(out, 0, 0);
  let F = O;
  if (opt.blur > 0) {
    F = document.createElement('canvas'); F.width = W; F.height = H;
    const fx = F.getContext('2d'); fx.filter = `blur(${opt.blur}px)`; fx.drawImage(O, 0, 0);
  }
  return F.toDataURL('image/jpeg', opt.jpeg);
};
</script>
</body>
</html>
